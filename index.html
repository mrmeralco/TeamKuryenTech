<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf2">
  <title>SmartWatts | Energy Dashboard</title>
  <!-- Hide the dashboard until the login check in src/lib/sessionGuard.ts passes. -->
  <script>document.documentElement.classList.add("auth-pending");</script>
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="game-ui.css">
  <link rel="stylesheet" href="visual-upgrade.css">
  <link rel="stylesheet" href="fun.css">
  <link rel="stylesheet" href="workspace.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"/></svg></span><span><b>Smart<span>Watts</span></b><small>Monitor. Save. Smarter.</small></span></div>
    <div class="workspace-switcher" id="workspaceSwitcher"></div>
    <button class="mobile-close" id="closeSidebar" aria-label="Close menu"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
    <nav id="navigation"></nav>
    <div class="help-card">
      <div class="help-icon"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></div><h3>Need Help?</h3>
      <p>Contact MERALCO support for any assistance.</p>
      <button class="btn btn-primary" data-page="support">Contact Support</button>
    </div>
    <div class="sidebar-footer">© 2026 SmartWatts</div>
  </aside>
  <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Close navigation menu" tabindex="-1"></button>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="welcome"><h1 id="pageTitle">Good morning, Rean Justine!</h1><p id="pageSubtitle">Here's what's happening with your electricity today.</p></div>
      <nav class="quick-nav" aria-label="Quick navigation">
        <button class="quick-link" data-page="breakdown">Analytics</button>
        <button class="quick-link" data-page="about">About Team</button>
      </nav>
      <div class="top-actions">
        <div class="chips" id="chips"></div>
        <div class="utility-controls">
          <label class="sr-only" for="ui-language">Interface language</label>
          <select class="select" id="ui-language" aria-label="Interface language">
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
          </select>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
        </div>
        <button class="provider"><span class="meralco-mark">M</span> MERALCO <span class="provider-chevron"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
        <button class="icon-button" data-page="notifications" aria-label="Notifications"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><i class="notification-dot">3</i></button>
        <button class="avatar" data-page="account">RJ</button>
        <button class="icon-button" id="logoutButton" type="button" aria-label="Log out" title="Log out"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </header>
    <section id="content" class="content"></section>
    <footer class="page-footer"><span>© 2026 SmartWatts. All rights reserved.</span><span>Data from MERALCO <b class="meralco-mark">M</b></span></footer>
  </main>
</div>
<nav class="mobile-tabbar" aria-label="Mobile navigation">
  <button data-page="dashboard" aria-label="Dashboard"><svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><small>Home</small></button>
  <button data-page="realtime" aria-label="Usage patterns"><svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><small>Patterns</small></button>
  <button data-page="goals" aria-label="Energy goals"><svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><small>Quests</small></button>
  <button data-page="rewards" aria-label="Rewards"><svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4"/></svg><small>Rewards</small></button>
  <button id="mobileMore" aria-label="Open menu"><svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><small>More</small></button>
</nav>
<div class="toast" id="toast"></div>
<div id="chat-root"></div>
<script type="module" src="/src/lib/sessionGuard.ts"></script>
<script type="module" src="/app.js"></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
