<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffaf7" />
    <title>SmartWatts setup required</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf7;color:#24202b;font:16px/1.6 Arial,sans-serif}
      main{max-width:560px;padding:32px;border:1px solid #ffe4d2;border-radius:20px;background:#fff;box-shadow:0 12px 40px #2c1c1214}
      h1{margin-top:0;color:#e96208}code{padding:3px 7px;border-radius:6px;background:#fff1e7}
    </style>
  </head>
  <body>
    <main>
      <h1>SmartWatts needs its frontend build</h1>
      <p>This React app cannot run by opening its source files through XAMPP. From the project folder, run:</p>
      <p><code>npm install</code><br /><code>npm run build</code></p>
      <p>Then refresh this page. For development, run <code>npm run dev</code> and open the local Vite URL it prints.</p>
    </main>
  </body>
</html>
