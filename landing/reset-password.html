<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — SmartWatts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/landing/auth.css">
<script>try{var t=localStorage.getItem('sw-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
<header>
  <a href="/"><img src="/landing/assets/915de05aaf826f819f98c0cd1bea330c.svg" alt="SmartWatts"></a>
  <a class="back" href="/login">← Back to log in</a>
</header>
<main>
  <div class="card">
    <p class="sub" id="loading">Checking your reset link…</p>

    <form id="resetForm" hidden novalidate>
      <h1>Set a new password</h1>
      <p class="sub">For <b id="forEmail"></b>. Use at least 8 characters.</p>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <label for="password2">Confirm new password</label>
      <input id="password2" type="password" autocomplete="new-password" required>
      <button class="primary" id="submit" type="submit">Save new password</button>
    </form>

    <div id="bad" hidden>
      <h1>Link expired</h1>
      <p class="sub" id="badText"></p>
      <a class="primary" href="/forgot-password" style="display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:#FF7B00;color:#0E0E0E;font-weight:600">Send a new link</a>
    </div>

    <div class="msg" id="msg" role="alert"></div>
  </div>
</main>
<script type="module">
import { checkResetCode, setNewPassword, friendlyError } from "/landing/auth.js";

const $ = (id) => document.getElementById(id);
const msg = (text, kind) => { $("msg").textContent = text || ""; $("msg").className = "msg" + (kind ? " " + kind : ""); };
const params = new URLSearchParams(location.search);
const oobCode = params.get("oobCode");

function showBad(text) { $("loading").hidden = true; $("bad").hidden = false; $("badText").textContent = text; }

if (params.get("mode") && params.get("mode") !== "resetPassword") {
  showBad("This link isn’t a password reset link.");
} else if (!oobCode) {
  showBad("This reset link is incomplete. Request a new one.");
} else {
  checkResetCode(oobCode)
    .then((email) => { $("loading").hidden = true; $("resetForm").hidden = false; $("forEmail").textContent = email; $("password").focus(); })
    .catch((err) => showBad(friendlyError(err)));
}

$("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = $("password").value;
  if (password.length < 8) return msg("Use a password with at least 8 characters.", "err");
  if (password !== $("password2").value) return msg("Passwords don’t match.", "err");
  $("submit").disabled = true; msg("");
  try {
    await setNewPassword(oobCode, password);
    location.replace("/login?reset=1");
  } catch (err) {
    msg(friendlyError(err), "err");
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
