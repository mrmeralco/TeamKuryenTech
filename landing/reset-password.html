<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Set a new password for your SmartWatts account.">
<meta name="application-name" content="SmartWatts">
<meta name="apple-mobile-web-app-title" content="SmartWatts">
<meta name="theme-color" content="#ff7b00">
<link rel="icon" type="image/svg+xml" href="/smartwatts-app-icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/smartwatts-icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — SmartWatts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/landing/auth.css">
<script src="/landing/theme-init.js"></script>
<script src="/deterrents.js" defer></script>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
<header>
  <a href="/"><img src="/landing/assets/915de05aaf826f819f98c0cd1bea330c.svg" alt="SmartWatts"></a>
  <a class="back" href="/login">← Back to log in</a>
</header>
<main>
  <div class="card">
    <p class="sub" id="loading">Checking your reset link…</p>

    <form id="resetForm" hidden novalidate>
      <h1>Set a new password</h1>
      <p class="sub">For <b id="forEmail"></b>. Use at least 8 characters.</p>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <label for="password2">Confirm new password</label>
      <input id="password2" type="password" autocomplete="new-password" required>
      <button class="primary" id="submit" type="submit">Save new password</button>
    </form>

    <div id="bad" hidden>
      <h1>Link expired</h1>
      <p class="sub" id="badText"></p>
      <a class="primary" href="/forgot-password" style="display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:#FF7B00;color:#0E0E0E;font-weight:600">Send a new link</a>
    </div>

    <div class="msg" id="msg" role="alert"></div>
  </div>
</main>
<script type="module" src="/landing/reset-password.js"></script>
</body>
</html>
