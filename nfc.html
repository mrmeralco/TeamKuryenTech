<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg">
  <title>SmartWatts | Opening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    :root {
      --bg: #fffaf2; --card: #ffffff; --ink: #2b1d0e; --muted: #6f5d4b; --line: #f1dfc7;
      --accent: #ff7a00; --accent-ink: #ffffff; --accent-soft: #fff1e0;
      --ok: #1f8a4c; --ok-soft: #e6f6ec; --warn: #b45d00; --warn-soft: #fff4e0; --danger: #c2362b; --danger-soft: #fdecea;
      --shadow: 0 18px 40px -22px rgba(120, 60, 0, .45);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191714; --card: #24201b; --ink: #f6eee4; --muted: #c2b3a2; --line: #3a322a;
        --accent-soft: #3a2711; --ok: #6fd39a; --ok-soft: #173325; --warn: #ffb35c; --warn-soft: #3a2a12; --danger: #ff8a80; --danger-soft: #3b1d1a;
        --shadow: 0 18px 40px -22px rgba(0, 0, 0, .8);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font: 700 16px/1.5 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .nfc-shell { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .nfc-logo { display: block; height: 72px; width: auto; }
    .nfc-logo-dark { display: none; }
    @media (prefers-color-scheme: dark) { .nfc-logo-light { display: none; } .nfc-logo-dark { display: block; } }
    .nfc-card {
      width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 24px;
      box-shadow: var(--shadow); padding: 28px 22px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .nfc-card h1 { margin: 6px 0 0; font: 700 1.45rem/1.2 Fredoka, Nunito, sans-serif; outline: none; }
    .nfc-detail { margin: 0; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
    .nfc-badge {
      width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
    }
    .nfc-badge-ok { background: var(--ok-soft); color: var(--ok); }
    .nfc-badge-warn { background: var(--warn-soft); color: var(--warn); }
    .nfc-badge-danger { background: var(--danger-soft); color: var(--danger); }
    .nfc-icon { width: 30px; height: 30px; }
    .nfc-spin { animation: nfc-spin 1s linear infinite; }
    @keyframes nfc-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .nfc-spin { animation: none; } }
    .nfc-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px; }
    .nfc-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid transparent;
      font: 700 1rem/1.2 Nunito, system-ui, sans-serif; cursor: pointer; text-decoration: none;
    }
    .nfc-btn-primary { background: var(--accent); color: var(--accent-ink); }
    .nfc-btn-primary:hover { filter: brightness(.95); }
    .nfc-btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .nfc-btn:focus-visible, .nfc-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .nfc-btn-icon { width: 20px; height: 20px; flex: none; }
    .nfc-list { list-style: none; margin: 8px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .nfc-item {
      width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
      padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
      font: inherit; min-height: 56px;
    }
    .nfc-item:hover { border-color: var(--accent); }
    .nfc-item-icon { width: 24px; height: 24px; color: var(--accent); flex: none; }
    .nfc-item-chevron { width: 20px; height: 20px; color: var(--muted); flex: none; margin-left: auto; }
    .nfc-item-text { display: flex; flex-direction: column; min-width: 0; }
    .nfc-item-name { font: 600 1.05rem/1.25 Fredoka, Nunito, sans-serif; overflow-wrap: anywhere; }
    .nfc-item-meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .nfc-chip { background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 1px 8px; font-size: .78rem; }
    .nfc-footer { color: var(--muted); font-size: .85rem; font-weight: 600; text-align: center; display: flex; align-items: center; gap: 6px; }
    .nfc-footer svg { width: 16px; height: 16px; color: var(--accent); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="nfc-shell" id="nfc-root" role="status" aria-live="polite" aria-busy="true" aria-labelledby="nfc-title">
    <img src="/branding/smartwatts-logo-light.svg" alt="SmartWatts" class="nfc-logo nfc-logo-light" width="69" height="72">
    <img src="/branding/smartwatts-logo-dark.svg" alt="" aria-hidden="true" class="nfc-logo nfc-logo-dark" width="69" height="72">
    <section class="nfc-card" id="nfc-card" data-state="opening">
      <h1 id="nfc-title">Opening SmartWatts</h1>
      <p class="nfc-detail">Getting things ready…</p>
      <noscript><p class="nfc-detail">SmartWatts needs JavaScript. <a href="/login">Sign in</a></p></noscript>
    </section>
    <p class="nfc-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/></svg>
      SmartWatts card · your sign-in decides what opens
    </p>
  </main>
  <script type="module" src="/src/nfc/main.ts"></script>
</body>
</html>
